    <path d="M0 174 C40 178 78 182 128 182 C181 182 218 176 256 171 L256 256 L0 256 Z" fill="#0c0c0d"/>
    <path d="M0 181 C41 185 76 191 128 191 C183 191 219 183 256 178" fill="none" stroke="#b57324" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M0 190 C41 194 76 198 128 198 C183 198 219 192 256 186" fill="none" stroke="#ffcf76" stroke-opacity="0.18" stroke-width="1.2"/>

