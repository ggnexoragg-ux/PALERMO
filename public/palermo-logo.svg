      <path d="M140 100 L168 103 L140 106" fill="none" stroke="#887261" stroke-width="1" opacity="0.7"/>
    </g>

    <g transform="translate(140 125) rotate(38)">
      <circle cx="0" cy="0" r="41" fill="none" stroke="#4d2215" stroke-width="8" opacity="0.9"/>
      <circle cx="0" cy="0" r="37" fill="none" stroke="url(#gold)" stroke-width="5"/>
      <circle cx="0" cy="0" r="33" fill="#ffffff" fill-opacity="0.08"/>
      <circle cx="0" cy="0" r="31" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
      <rect x="33" y="33" width="13" height="56" rx="6" fill="#3a2218" stroke="url(#gold)" stroke-width="3"/>
