      <rect x="89" y="132" width="18" height="47"/>
      <path d="M86 132 C95 114 101 114 110 132 Z"/>
      <rect x="132" y="116" width="27" height="65" rx="3"/>
      <path d="M127 116 C140 89 151 89 164 116 Z"/>
