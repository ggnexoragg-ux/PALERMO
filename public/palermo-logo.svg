<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Palermo Online emblem</title>
  <desc id="desc">A noir Palermo game emblem with city skyline, moon, knife and magnifying glass.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#621012"/>
      <stop offset="55%" stop-color="#ab140f"/>
      <stop offset="100%" stop-color="#1a0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#f8d89a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f8d89a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8df9d"/>
      <stop offset="45%" stop-color="#d3a75a"/>
      <stop offset="100%" stop-color="#8d5e22"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1ddc4"/>
      <stop offset="50%" stop-color="#b6a08c"/>
      <stop offset="100%" stop-color="#6e5a4d"/>
    </linearGradient>
    <clipPath id="clipCircle">
      <circle cx="128" cy="128" r="112"/>
    </clipPath>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="#080809"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#271809" stroke-width="6"/>
  <circle cx="128" cy="128" r="114" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <g clip-path="url(#clipCircle)">
    <rect x="0" y="0" width="256" height="256" fill="url(#sky)"/>
    <rect x="0" y="0" width="256" height="256" fill="url(#glow)"/>
    <circle cx="189" cy="71" r="29" fill="#f6dca2" opacity="0.95"/>
    <circle cx="182" cy="65" r="3" fill="#d3b173" opacity="0.55"/>
    <circle cx="197" cy="78" r="4" fill="#d3b173" opacity="0.45"/>
    <circle cx="191" cy="58" r="2.6" fill="#d3b173" opacity="0.45"/>

    <path d="M63 96 L110 70 L149 89 L180 74 L201 92 L201 121 L63 121 Z" fill="#53100e" opacity="0.55"/>
    <path d="M0 150 L14 120 L28 145 L44 108 L57 148 L76 98 L89 152 L105 117 L120 151 L138 99 L151 150 L166 114 L179 145 L195 124 L210 150 L227 111 L242 154 L256 136 L256 256 L0 256 Z" fill="#090909"/>

